{% extends "base.html" %}
{% block title %}Join {{ practice.name }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Join {{ practice.name }}</h1>
  <p>Hi {{ invitee.name }}. Choose a password for <strong>{{ invitee.email }}</strong>.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/invite/{{ token }}">
    <input type="hidden" name="csrf_token" value="{{ pre_csrf }}">
    <label>Password <span class="hint">at least 12 characters</span>
      <input type="password" name="password" required minlength="12" autocomplete="new-password"></label>
    <label>Password again <input type="password" name="password2" required minlength="12" autocomplete="new-password"></label>
    <button class="primary" type="submit">Set password</button>
  </form>
</div>
{% endblock %}
