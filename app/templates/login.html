{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ pre_csrf }}">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required autocomplete="username" autofocus></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
  {% if sso %}
  <div class="sso">
    <p class="muted small">or</p>
    {% for p in sso %}<a class="button" href="/sso/{{ p }}/start">Sign in with {{ SSO[p].label }}</a>{% endfor %}
  </div>
  {% endif %}
  <p class="muted">New practice? <a href="/signup">Create an account</a></p>
</div>
{% endblock %}
